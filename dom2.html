<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <title>DOM 생성 삽입 삭제 복제</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <script src="./scripts/dom2.js" defer></script>
    <style>
        header {}
        header .d_menu {}
        header .d_menu nav {}
        header .d_menu nav a {color:#00f;} /* html에 태그가 없어도 js에서 cloneNode로 해서  만들어줬다면 css에서 선택자를 넣을 수 있다. */
        header .m_menu {}
        header .m_menu nav {}
        header .m_menu nav a {color:#f00;}
    </style>
</head>
<body>
    <header>
        <!-- 데스크탑 메뉴(JS 동적붙여넣기 대상) -->
        <div class="d_menu"><!-- 붙여넣기위치 --></div>
        <!-- 모바일 메뉴(태그o) -->
        <div class="m_menu">
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Project</a>
                <a href="#">Contact</a>
            </nav>
        </div>
    </header>
</body>
</html>
